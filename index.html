<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Invaders - Touch</title>
    <style>
        * { touch-action: manipulation; box-sizing: border-box; }
        body { background: #111; color: #fff; text-align: center; font-family: Arial, sans-serif; margin: 0; padding: 10px; user-select: none; -webkit-user-select: none; }
        canvas { background: #000; border: 2px solid #444; display: block; margin: 10px auto; width: 100%; max-width: 600px; height: auto; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-top: 10px; max-width: 600px; margin: 0 auto; }
        .btn { background: #222; border: 2px solid #00ffcc; color: #00ffcc; font-size: 24px; padding: 20px; border-radius: 12px; flex: 1; user-select: none; }
        .btn-fire { border-color: #ff4444; color: #ff4444; }
        .btn:active { background: #444; }
    </style>
</head>
<body>
    <h2 style="margin: 5px 0;">SPACE INVADERS</h2>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div class="controls">
        <button class="btn" id="leftBtn">◀</button>
        <button class="btn btn-fire" id="fireBtn">💥</button>
        <button class="btn" id="rightBtn">▶</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const player = { x: 285, y: 360, w: 30, h: 15, speed: 6, dx: 0 };
        let bullets = [], invaders = [], score = 0, gameOver = false;

        const rows = 3, cols = 8, invaderW = 35, invaderH = 20, padding = 15;
        let invaderSpeed = 1, invaderDir = 1;

        function initInvaders() {
            invaders = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    invaders.push({
                        x: 50 + c * (invaderW + padding),
                        y: 30 + r * (invaderH + padding),
                        w: invaderW, h: invaderH, alive: true
                    });
                }
            }
        }

        function bindTouch(id, onStart, onEnd) {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); onStart(); };
            const end = (e) => { e.preventDefault(); if (onEnd) onEnd(); };
            el.addEventListener('touchstart', start, { passive: false });
            el.addEventListener('touchend', end, { passive: false });
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
        }

        bindTouch('leftBtn', () => player.dx = -player.speed, () => player.dx = 0);
        bindTouch('rightBtn', () => player.dx = player.speed, () => player.dx = 0);
        bindTouch('fireBtn', () => {
            if (!gameOver) bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 10, speed: 8 });
        });

        function update() {
            if (gameOver) return;

            player.x = Math.max(0, Math.min(canvas.width - player.w, player.x + player.dx));

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < 0) bullets.splice(i, 1);
            }

            let shiftDown = false;
            invaders.forEach(inv => {
                if (!inv.alive) return;
                if ((inv.x + inv.w >= canvas.width && invaderDir > 0) || (inv.x <= 0 && invaderDir < 0)) shiftDown = true;
            });

            if (shiftDown) {
                invaderDir *= -1;
                invaders.forEach(inv => inv.y += 12);
            }

            invaders.forEach(inv => {
                if (inv.alive) {
                    inv.x += invaderSpeed * invaderDir;
                    if (inv.y + inv.h >= player.y) gameOver = true;
                }
            });

            bullets.forEach((b, bIdx) => {
                invaders.forEach(inv => {
                    if (inv.alive && b.x < inv.x + inv.w && b.x + b.w > inv.x && b.y < inv.y + inv.h && b.y + b.h > inv.y) {
                        inv.alive = false;
                        bullets.splice(bIdx, 1);
                        score += 10;
                    }
                });
            });

            if (invaders.length > 0 && invaders.every(inv => !inv.alive)) gameOver = true;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(player.x, player.y, player.w, player.h);

            ctx.fillStyle = '#ffff00';
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

            ctx.fillStyle = '#ff4444';
            invaders.forEach(inv => { if (inv.alive) ctx.fillRect(inv.x, inv.y, inv.w, inv.h); });

            ctx.fillStyle = '#ffffff';
            ctx.font = '16px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`Score: ${score}`, 10, 25);

            if (gameOver) {
                ctx.textAlign = 'center';
                ctx.font = '30px Arial';
                const won = invaders.every(inv => !inv.alive);
                ctx.fillText(won ? "YOU WIN!" : "GAME OVER", canvas.width / 2, canvas.height / 2);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        initInvaders();
        gameLoop();
    </script>
</body>
</html>
