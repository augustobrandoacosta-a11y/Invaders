<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Global Conquest: Invader Edition</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
        body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
        .stat-box { font-weight: bold; font-size: 16px; color: #38bdf8; }
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 14px; background: #1e293b; border: 1px solid #334155; color: #94a3b8; border-radius: 10px; font-weight: bold; font-size: 15px; text-align: center; }
        .tab-btn.active { background: #2563eb; color: #fff; border-color: #3b82f6; }
        .section { display: none; }
        .section.active { display: block; }
        
        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; }
        .card-info { display: flex; align-items: center; gap: 12px; }
        .flag { font-size: 32px; }
        .action-btn { background: #22c55e; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; font-size: 14px; }
        .action-btn:disabled { background: #475569; opacity: 0.6; }
        
        /* Battle Canvas Modal */
        #battleOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.95); flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .battle-bar-container { width: 80%; background: #334155; height: 24px; border-radius: 12px; overflow: hidden; margin: 20px 0; border: 2px solid #64748b; }
        .battle-bar { width: 50%; height: 100%; background: #ef4444; transition: width 0.1s linear; }
        .tap-target { width: 160px; height: 160px; border-radius: 50%; background: #2563eb; border: 4px solid #60a5fa; color: white; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(37,99,235,0.5); }
        .tap-target:active { transform: scale(0.95); background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div style="font-size: 12px; color: #94a3b8;">COMMANDER</div>
            <div id="playerSkinTitle" style="font-weight: bold; color: #f43f5e;">Red Legion</div>
        </div>
        <div class="stat-box">🪙 <span id="goldDisplay">100</span> Gold</div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('soloTab', this)">🌐 AI Campaign</button>
        <button class="tab-btn" onclick="switchTab('pvpTab', this)">⚔️ PvP Arena</button>
        <button class="tab-btn" onclick="switchTab('shopTab', this)">🛍️ Skins Shop</button>
    </div>

    <!-- SOLO AI CAMPAIGN -->
    <div id="soloTab" class="section active"></div>

    <!-- PLAYER CHALLENGE ARENA -->
    <div id="pvpTab" class="section"></div>

    <!-- SKINS SHOP -->
    <div id="shopTab" class="section"></div>

    <!-- BATTLE OVERLAY -->
    <div id="battleOverlay">
        <h2 id="battleTitle">Invading Country...</h2>
        <p style="color: #94a3b8;">TAP FAST TO OVERPOWER DEFENSES!</p>
        <div class="battle-bar-container">
            <div id="battleBar" class="battle-bar"></div>
        </div>
        <button class="tap-target" id="tapBtn">ATTACK!</button>
    </div>

    <script>
        // Game State
        let state = {
            gold: 100,
            activeSkin: 'Red Army',
            ownedSkins: ['Red Army'],
            conqueredAI: []
        };

        const skins = [
            { id: 'Red Army', price: 0, power: 1.0, icon: '🚩', color: '#f43f5e' },
            { id: 'Cyber Strike', price: 200, power: 1.3, icon: '⚡', color: '#06b6d4' },
            { id: 'Golden Empire', price: 500, power: 1.8, icon: '👑', color: '#eab308' },
            { id: 'Void Invaders', price: 1200, power: 2.5, icon: '👾', color: '#a855f7' }
        ];

        const aiCountries = [
            { id: 'c1', name: 'Tiny Atoll', flag: '🏝️', defense: 30, reward: 80 },
            { id: 'c2', name: 'Desert Republic', flag: '🏜️', defense: 75, reward: 180 },
            { id: 'c3', name: 'Alpine Kingdom', flag: '🏔️', defense: 140, reward: 350 },
            { id: 'c4', name: 'Industrial Union', flag: '🏭', defense: 250, reward: 600 },
            { id: 'c5', name: 'Global Superpower', flag: '🏰', defense: 450, reward: 1200 }
        ];

        const pvpPlayers = [
            { name: 'Commander_Viper', flag: '🐉', defense: 100, reward: 250 },
            { name: 'ShadowRiderX', flag: '🥷', defense: 220, reward: 500 },
            { name: 'Overlord_99', flag: '🤖', defense: 400, reward: 950 }
        ];

        let currentBattle = null;
        let battleProgress = 50;
        let battleInterval = null;

        function updateUI() {
            document.getElementById('goldDisplay').innerText = state.gold;
            document.getElementById('playerSkinTitle').innerText = state.activeSkin;
            renderSolo();
            renderPVP();
            renderShop();
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function renderSolo() {
            const container = document.getElementById('soloTab');
            container.innerHTML = aiCountries.map(c => {
                const conquered = state.conqueredAI.includes(c.id);
                return `
                    <div class="card">
                        <div class="card-info">
                            <span class="flag">${c.flag}</span>
                            <div>
                                <div style="font-weight:bold">${c.name}</div>
                                <div style="font-size:12px; color:#94a3b8">Defense: ${c.defense} | Reward: 🪙${c.reward}</div>
                            </div>
                        </div>
                        <button class="action-btn" ${conquered ? 'disabled' : ''} onclick="startBattle('${c.name}', ${c.defense}, ${c.reward}, '${c.id}', 'ai')">
                            ${conquered ? 'Occupied' : 'Invade'}
                        </button>
                    </div>`;
            }).join('');
        }

        function renderPVP() {
            const container = document.getElementById('pvpTab');
            container.innerHTML = pvpPlayers.map(p => `
                <div class="card">
                    <div class="card-info">
                        <span class="flag">${p.flag}</span>
                        <div>
                            <div style="font-weight:bold">${p.name}</div>
                            <div style="font-size:12px; color:#94a3b8">Fortress Power: ${p.defense} | Bounty: 🪙${p.reward}</div>
                        </div>
                    </div>
                    <button class="action-btn" style="background:#8b5cf6;" onclick="startBattle('${p.name}', ${p.defense}, ${p.reward}, null, 'pvp')">
                        Challenge
                    </button>
                </div>`).join('');
        }

        function renderShop() {
            const container = document.getElementById('shopTab');
            container.innerHTML = skins.map(s => {
                const owned = state.ownedSkins.includes(s.id);
                const active = state.activeSkin === s.id;
                return `
                    <div class="card">
                        <div class="card-info">
                            <span class="flag">${s.icon}</span>
                            <div>
                                <div style="font-weight:bold; color:${s.color}">${s.id}</div>
                                <div style="font-size:12px; color:#94a3b8">Attack Multiplier: x${s.power}</div>
                            </div>
                        </div>
                        <button class="action-btn" style="background:${active ? '#0284c7' : '#334155'}" 
                            onclick="handleSkin('${s.id}', ${s.price})" ${active ? 'disabled' : ''}>
                            ${active ? 'Equipped' : owned ? 'Equip' : '🪙 ' + s.price}
                        </button>
                    </div>`;
            }).join('');
        }

        function handleSkin(skinId, price) {
            if (state.ownedSkins.includes(skinId)) {
                state.activeSkin = skinId;
            } else if (state.gold >= price) {
                state.gold -= price;
                state.ownedSkins.push(skinId);
                state.activeSkin = skinId;
            }
            updateUI();
        }

        function startBattle(name, defense, reward, id, mode) {
            const skinObj = skins.find(s => s.id === state.activeSkin);
            currentBattle = { name, defense, reward, id, mode, skinPower: skinObj.power };
            battleProgress = 50;
            
            document.getElementById('battleTitle').innerText = `Invading ${name}`;
            document.getElementById('battleOverlay').style.display = 'flex';
            
            // Enemy auto-push back timer
            battleInterval = setInterval(() => {
                battleProgress -= (defense / 20);
                updateBattleBar();
                if (battleProgress <= 0) endBattle(false);
            }, 100);
        }

        document.getElementById('tapBtn').addEventListener('touchstart', (e) => { e.preventDefault(); registerTap(); });
        document.getElementById('tapBtn').addEventListener('click', registerTap);

        function registerTap() {
            if (!currentBattle) return;
            battleProgress += (8 * currentBattle.skinPower);
            updateBattleBar();
            if (battleProgress >= 100) endBattle(true);
        }

        function updateBattleBar() {
            document.getElementById('battleBar').style.width = `${Math.min(100, Math.max(0, battleProgress))}%`;
        }

        function endBattle(won) {
            clearInterval(battleInterval);
            document.getElementById('battleOverlay').style.display = 'none';
            
            if (won) {
                state.gold += currentBattle.reward;
                if (currentBattle.mode === 'ai' && currentBattle.id) {
                    state.conqueredAI.push(currentBattle.id);
                }
                alert(`VICTORY! You conquered ${currentBattle.name} and earned 🪙${currentBattle.reward} Gold!`);
            } else {
                alert(`DEFEAT! ${currentBattle.name}'s defenses repelled your invasion force.`);
            }
            currentBattle = null;
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
